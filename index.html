}

/* PLAYER */

#player{

content:'';

/* NPC */

.npc{
position:absolute;

height:60px;
background:#f59e0b;

border:4px solid white;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:20px;
}

/* ENEMY */

.enemy{
position:absolute;
width:60px;
height:60px;
background:#dc2626;
border-radius:14px;
border:4px solid white;
}

/* HUD */

#topHud{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:14px;
z-index:999;
}

.hudBox{
background:rgba(15,23,42,0.9);
padding:12px 18px;
border-radius:14px;
border:2px solid #334155;
font-weight:bold;
}

/* QUEST */

#quest{
position:fixed;
top:80px;
left:50%;
transform:translateX(-50%);
background:rgba(15,23,42,0.95);
padding:14px 20px;
border-radius:14px;
border:2px solid #334155;
z-index:999;
}

/* HOTBAR */

#hotbar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
z-index:999;
}

.slot{
width:70px;
height:70px;
background:#1e293b;
border:3px solid #475569;
border-radius:14px;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
}

.slot.active{
border-color:#f97316;
transform:translateY(-5px);
}

/* INVENTORY */

#inventory{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:650px;
background:rgba(15,23,42,0.97);
padding:25px;
border-radius:22px;
border:3px solid #334155;
display:none;
z-index:3000;
}

#inventoryGrid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:10px;
margin-top:20px;
}

.invSlot{
height:80px;
background:#1e293b;
border:2px solid #475569;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
}

/* TAB */

#tabMenu{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
z-index:4000;
}

#tabContent{
width:400px;
background:#0f172a;
padding:35px;
border-radius:24px;
border:3px solid #334155;
text-align:center;
}

/* ADS */

#adLeft,
#adRight{
position:fixed;
top:120px;
width:160px;
height:600px;
background:#111827;
border-radius:18px;
border:2px solid #1e293b;
padding:10px;
z-index:500;
}

#adLeft{
left:10px;
}

#adRight{
right:10px;
}

/* REWARD */

#rewardBtn{
position:fixed;
right:30px;
bottom:120px;
padding:16px 22px;
background:#f97316;
border:none;
border-radius:16px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
z-index:1000;
}

#boostTimer{
position:fixed;
right:30px;
bottom:70px;
background:#0f172a;
padding:12px 18px;
border-radius:14px;
border:2px solid #334155;
font-weight:bold;
z-index:999;
}

/* DAMAGE */

#damageText{
position:fixed;
top:140px;
left:50%;
transform:translateX(-50%);
font-size:34px;
font-weight:bold;
color:#ff6666;
z-index:5000;
pointer-events:none;
}

/* MOBILE */

@media(max-width:1000px){

#adLeft,
#adRight{
display:none;
}

}

<script>

/* ADS */

(adsbygoogle = window.adsbygoogle || []).push({});
(adsbygoogle = window.adsbygoogle || []).push({});

/* VARIABLES */

const player =
document.getElementById('player');

const world =
document.getElementById('world');

const enemies =
document.querySelectorAll('.enemy');

let x = 2400;
let y = 2400;

let speed = 6;

let keys = {};

let xp = 0;
let level = 1;
let coins = 0;
let hp = 100;

let damage = 15;

let xpNeeded = 100;

let doubleXP = false;

let boostSeconds = 0;

let questStage = 0;

let inventory = [
'🗡',
'🏹',
'🧪',
'🛡',
'🍖',
'',
'',
'',
'',
'',
'',
''
];

const monsterDrops = [
'🪙',
'🧪',
'💎',
'⚔',
'🛡',
'🍖'
];

/* LOAD */

function loadGame(){

const save =
JSON.parse(
localStorage.getItem(
'schoolMMO'
));

if(save){

x = save.x || 2400;
y = save.y || 2400;
xp = save.xp || 0;
level = save.level || 1;
coins = save.coins || 0;
hp = save.hp || 100;
damage = save.damage || 15;
xpNeeded =
save.xpNeeded || 100;

inventory =
save.inventory || inventory;

questStage =
save.questStage || 0;

boostSeconds =
save.boostSeconds || 0;

}

updateHud();

}

loadGame();

/* SAVE */

setInterval(()=>{

localStorage.setItem(
'schoolMMO',

JSON.stringify({

x,
y,
xp,
level,
coins,
hp,
damage,
xpNeeded,
inventory,
questStage,
boostSeconds

})

);

},3000);

/* INVENTORY */

function renderInventory(){

const grid =
document.getElementById(
'inventoryGrid'
);

grid.innerHTML = '';

inventory.forEach(item=>{

const slot =
document.createElement('div');

slot.className = 'invSlot';

slot.innerText = item;

grid.appendChild(slot);

});

}

renderInventory();

/* HUD */

function updateHud(){

document.getElementById(
'xp'
).innerText = xp;

document.getElementById(
'level'
).innerText = level;

document.getElementById(
'coins'
).innerText = coins;

document.getElementById(
'hp'
).innerText = hp;

document.getElementById(
'tabXP'
).innerText = xp;

document.getElementById(
'tabLevel'
).innerText = level;

document.getElementById(
'tabCoins'
).innerText = coins;

renderInventory();

}

/* XP */

function gainXP(amount){

xp += amount;

while(xp >= xpNeeded){

xp -= xpNeeded;

level++;

xpNeeded =
Math.floor(
xpNeeded * 1.35
);

damage += 5;

hp += 20;

coins += 50;

}

updateHud();

}

/* CONTROLS */

window.addEventListener(
'keydown',

e=>{

keys[e.key.toLowerCase()] = true;

if(e.key === 'Tab'){

e.preventDefault();

document.getElementById(
'tabMenu'
).style.display = 'flex';

}

if(e.key.toLowerCase() === 'e'){

const inv =
document.getElementById(
'inventory'
);

if(inv.style.display === 'block'){

inv.style.display = 'none';

}
else{

inv.style.display = 'block';

}

}

if(e.key === ' '){

attack();

}

if(['1','2','3','4','5']
.includes(e.key)){

selectSlot(e.key);

}

});

window.addEventListener(
'keyup',

e=>{

keys[e.key.toLowerCase()] = false;

if(e.key === 'Tab'){

document.getElementById(
'tabMenu'
).style.display = 'none';

}

});

/* HOTBAR */

function selectSlot(num){

document.querySelectorAll('.slot')
.forEach(slot=>{

slot.classList.remove('active');

if(slot.dataset.slot === num){

slot.classList.add('active');

}

});

}

/* ATTACK */

function attack(){

const damageText =
document.getElementById(
'damageText'
);

enemies.forEach(enemy=>{

if(enemy.style.display === 'none')
return;

let ex =
parseInt(enemy.style.left);

let ey =
parseInt(enemy.style.top);

let dist =
Math.hypot(ex - x, ey - y);

if(dist < 140){

damageText.innerText =
'-' + damage;

setTimeout(()=>{

damageText.innerText = '';

},400);

enemy.style.display = 'none';

coins +=
Math.floor(
Math.random()*60
)+20;

gainXP(
doubleXP ? 45 : 25
);

const rngDrop =
monsterDrops[
Math.floor(
Math.random() *
monsterDrops.length
)
];

let empty =
inventory.indexOf('');

if(empty !== -1){

inventory[empty] =
rngDrop;

}

updateHud();

setTimeout(()=>{

enemy.style.display = 'block';

enemy.style.left =
(Math.random()*4200+300)+'px';

enemy.style.top =
(Math.random()*4200+300)+'px';

},15000);

}

});

}

/* QUEST */

const teacher =
document.getElementById(
'teacher'
);

const blacksmith =
document.getElementById(
'blacksmith'
);

setInterval(()=>{

if(questStage === 0){

let tx =
parseInt(teacher.style.left);

let ty =
parseInt(teacher.style.top);

let dist =
Math.hypot(tx - x, ty - y);

if(dist < 120){

questStage = 1;

coins += 100;

gainXP(50);

document.getElementById(
'quest'
).innerText =

'Quest 2: Visit the blacksmith';

}

}

else if(questStage === 1){

let bx =
parseInt(blacksmith.style.left);

let by =
parseInt(blacksmith.style.top);

let dist =
Math.hypot(bx - x, by - y);

if(dist < 120){

questStage = 2;

coins += 150;

gainXP(75);

damage += 5;

document.getElementById(
'quest'
).innerText =

'Quest 3: Defeat enemies';

}

}

},1000);

/* REWARD */

document.getElementById(
'rewardBtn'
).onclick = ()=>{

doubleXP = true;

boostSeconds = 300;

document.getElementById(
'rewardBtn'
).innerText =

'Double XP Active!';

};

/* BOOST TIMER */

setInterval(()=>{

if(boostSeconds > 0){

boostSeconds--;

const mins =
Math.floor(
boostSeconds / 60
);

const secs =
boostSeconds % 60;

document.getElementById(
'boostTimer'
).innerText =

`XP Boost: ${mins}:${secs
.toString()
.padStart(2,'0')}`;

if(boostSeconds <= 0){

doubleXP = false;

document.getElementById(
'rewardBtn'
).innerText =

'▶ Watch Ad → Double XP';

}

}

},1000);

/* GAME LOOP */

function gameLoop(){

if(keys['w']) y -= speed;
if(keys['s']) y += speed;
if(keys['a']) x -= speed;
if(keys['d']) x += speed;

player.style.left = x + 'px';
player.style.top = y + 'px';

const camX =
window.innerWidth / 2 - x - 32;

const camY =
window.innerHeight / 2 - y - 32;

world.style.transform =
`translate(${camX}px, ${camY}px)`;

requestAnimationFrame(gameLoop);

}

updateHud();

gameLoop();

</script>
