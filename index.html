<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>School Essentials MMORPG</title>

  <!-- FAVICON -->
  <link rel="icon"
  type="image/png"
  href="favicon.png">

  <!-- GOOGLE ADSENSE -->
  <script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613"
  crossorigin="anonymous"></script>

  <meta name="google-adsense-account"
  content="ca-pub-4335653991954613">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      overflow:hidden;
      background:#020617;
      color:white;
    }

    canvas{
      display:block;
      background:#020617;
    }

    /* HUD */

    .hud{

      position:fixed;

      top:15px;
      left:15px;

      width:300px;

      background:rgba(15,23,42,0.95);

      border:2px solid #1e293b;

      border-radius:20px;

      padding:18px;

      z-index:500;

      backdrop-filter:blur(10px);

    }

    .hud h1{
      color:#f97316;
      margin-bottom:15px;
      font-size:1.8rem;
    }

    .stat{
      margin-bottom:10px;
      color:#cbd5e1;
      font-size:1rem;
    }

    .xp-bar{

      width:100%;
      height:18px;

      background:#1e293b;

      border-radius:20px;

      overflow:hidden;

      margin-top:8px;

    }

    .xp-fill{

      height:100%;
      width:0%;

      background:#f97316;

      transition:0.3s;

    }

    /* QUEST */

    .quest-box{

      margin-top:18px;

      padding-top:15px;

      border-top:1px solid #334155;

    }

    .quest-title{
      color:#f97316;
      margin-bottom:8px;
      font-weight:bold;
    }

    /* ADS */

    .ads-panel{

      position:fixed;

      top:15px;
      right:15px;

      width:320px;

      background:rgba(15,23,42,0.95);

      border:2px solid #1e293b;

      border-radius:20px;

      padding:15px;

      z-index:500;

    }

    .ads-title{

      text-align:center;

      color:#f97316;

      margin-bottom:10px;

      font-weight:bold;

    }

    /* DIALOG */

    .dialogue-box{

      position:fixed;

      bottom:20px;
      left:50%;

      transform:translateX(-50%);

      width:800px;
      max-width:92%;

      background:rgba(15,23,42,0.97);

      border:2px solid #f97316;

      border-radius:20px;

      padding:20px;

      z-index:1000;

      display:none;

    }

    .dialogue-name{

      color:#f97316;

      font-size:1.2rem;

      font-weight:bold;

      margin-bottom:10px;

    }

    .dialogue-text{

      color:#e2e8f0;

      line-height:1.6;

    }

    /* CONTROLS */

    .controls{

      position:fixed;

      bottom:20px;
      left:20px;

      background:rgba(15,23,42,0.95);

      border:2px solid #1e293b;

      border-radius:18px;

      padding:12px;

      color:#cbd5e1;

      z-index:500;

    }

    /* INVENTORY */

    .inventory{

      position:fixed;

      bottom:20px;
      right:20px;

      width:300px;

      background:rgba(15,23,42,0.95);

      border:2px solid #1e293b;

      border-radius:20px;

      padding:15px;

      z-index:500;

    }

    .inventory h2{
      color:#f97316;
      margin-bottom:12px;
      font-size:1.2rem;
    }

    .item{
      background:#1e293b;
      padding:10px;
      border-radius:12px;
      margin-bottom:8px;
      color:#e2e8f0;
    }

    /* MOBILE */

    @media(max-width:900px){

      .ads-panel{
        display:none;
      }

      .inventory{
        width:220px;
      }

      .hud{
        width:240px;
      }

    }

  </style>

</head>

<body>

  <!-- HUD -->

  <div class="hud">

    <h1>🎒 School Essentials</h1>

    <div class="stat">
      Level:
      <span id="level">1</span>
    </div>

    <div class="stat">
      XP:
      <span id="xp">0</span>/100
    </div>

    <div class="xp-bar">
      <div class="xp-fill"
      id="xpFill"></div>
    </div>

    <div class="stat">
      Coins:
      <span id="coins">0</span>
    </div>

    <div class="stat">
      Energy:
      <span id="energy">100</span>
    </div>

    <div class="quest-box">

      <div class="quest-title">
        Current Quest
      </div>

      <div id="questText">
        Talk to the Math Teacher.
      </div>

    </div>

  </div>

  <!-- ADS -->

  <div class="ads-panel">

    <div class="ads-title">
      Sponsored
    </div>

    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-4335653991954613"
      data-ad-slot="1234567890"
      data-ad-format="auto"
      data-full-width-responsive="true"></ins>

  </div>

  <!-- CONTROLS -->

  <div class="controls">

    WASD = Move<br>
    SHIFT = Sprint<br>
    E = Interact

  </div>

  <!-- INVENTORY -->

  <div class="inventory">

    <h2>🎒 Inventory</h2>

    <div class="item">
      📘 Math Book
    </div>

    <div class="item">
      🍎 Cafeteria Snack
    </div>

    <div class="item">
      ✏ Pencil
    </div>

  </div>

  <!-- DIALOG -->

  <div class="dialogue-box"
  id="dialogueBox">

    <div class="dialogue-name"
    id="dialogueName">

      NPC

    </div>

    <div class="dialogue-text"
    id="dialogueText">

      Hello.

    </div>

  </div>

  <!-- GAME -->

  <canvas id="game"></canvas>

  <script>

    // ADS

    (adsbygoogle =
    window.adsbygoogle || []).push({});

    // CANVAS

    const canvas =
    document.getElementById("game");

    const ctx =
    canvas.getContext("2d");

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

    // PLAYER

    const player = {

      x:300,
      y:300,

      size:35,

      speed:4,

      color:"#f97316"

    };

    // STATS

    let level = 1;
    let xp = 0;
    let coins = 0;
    let energy = 100;

    // KEYS

    const keys = {};

    document.addEventListener(
      "keydown",
      e=>{

        keys[e.key.toLowerCase()] = true;

      }
    );

    document.addEventListener(
      "keyup",
      e=>{

        keys[e.key.toLowerCase()] = false;

      }
    );

    // NPCS

    const npcs = [

      {
        x:700,
        y:180,
        color:"#38bdf8",
        name:"Math Teacher",
        text:"Complete your algebra homework to earn XP."
      },

      {
        x:1000,
        y:550,
        color:"#22c55e",
        name:"Student",
        text:"The cafeteria has energy drinks today."
      },

      {
        x:450,
        y:700,
        color:"#e879f9",
        name:"Principal",
        text:"Attendance matters. Don't skip class."
      },

      {
        x:1300,
        y:350,
        color:"#ef4444",
        name:"Gym Coach",
        text:"Run laps to increase stamina."
      }

    ];

    // BUILDINGS

    const rooms = [

      {
        x:100,
        y:100,
        w:400,
        h:260,
        color:"#1e293b",
        label:"Math Class"
      },

      {
        x:620,
        y:100,
        w:420,
        h:260,
        color:"#1e293b",
        label:"Science Lab"
      },

      {
        x:100,
        y:480,
        w:400,
        h:260,
        color:"#1e293b",
        label:"Cafeteria"
      },

      {
        x:620,
        y:480,
        w:420,
        h:260,
        color:"#1e293b",
        label:"Gym"
      }

    ];

    // UPDATE

    function update(){

      let speed =
      keys["shift"] ? 7 : 4;

      if(keys["w"]){
        player.y -= speed;
      }

      if(keys["s"]){
        player.y += speed;
      }

      if(keys["a"]){
        player.x -= speed;
      }

      if(keys["d"]){
        player.x += speed;
      }

      // INTERACT

      if(keys["e"]){

        npcs.forEach(npc=>{

          let dx =
          player.x - npc.x;

          let dy =
          player.y - npc.y;

          let distance =
          Math.sqrt(dx*dx + dy*dy);

          if(distance < 80){

            showDialogue(
              npc.name,
              npc.text
            );

            xp += 10;
            coins += 5;

            if(xp >= 100){

              xp = 0;
              level++;

            }

            updateHud();

          }

        });

      }

    }

    // DRAW

    function draw(){

      ctx.fillStyle = "#020617";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      // GRID

      for(let x=0;
      x<canvas.width;
      x+=60){

        for(let y=0;
        y<canvas.height;
        y+=60){

          ctx.strokeStyle =
          "#0f172a";

          ctx.strokeRect(
            x,
            y,
            60,
            60
          );

        }

      }

      // ROOMS

      rooms.forEach(room=>{

        ctx.fillStyle =
        room.color;

        ctx.fillRect(
          room.x,
          room.y,
          room.w,
          room.h
        );

        ctx.strokeStyle =
        "#f97316";

        ctx.lineWidth = 4;

        ctx.strokeRect(
          room.x,
          room.y,
          room.w,
          room.h
        );

        ctx.fillStyle =
        "white";

        ctx.font =
        "28px Arial";

        ctx.fillText(
          room.label,
          room.x + 20,
          room.y + 40
        );

      });

      // NPCS

      npcs.forEach(npc=>{

        ctx.fillStyle =
        npc.color;

        ctx.fillRect(
          npc.x,
          npc.y,
          35,
          35
        );

        ctx.fillStyle =
        "white";

        ctx.font =
        "16px Arial";

        ctx.fillText(
          npc.name,
          npc.x - 10,
          npc.y - 10
        );

      });

      // PLAYER

      ctx.fillStyle =
      player.color;

      ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
      );

      ctx.fillStyle =
      "white";

      ctx.font =
      "18px Arial";

      ctx.fillText(
        "YOU",
        player.x,
        player.y - 10
      );

    }

    // DIALOG

    function showDialogue(name,text){

      const box =
      document.getElementById(
      "dialogueBox"
      );

      document.getElementById(
      "dialogueName"
      ).innerText = name;

      document.getElementById(
      "dialogueText"
      ).innerText = text;

      box.style.display = "block";

      clearTimeout(
      window.dialogTimeout
      );

      window.dialogTimeout =
      setTimeout(()=>{

        box.style.display = "none";

      },4000);

    }

    // HUD

    function updateHud(){

      document.getElementById(
      "level").innerText = level;

      document.getElementById(
      "xp").innerText = xp;

      document.getElementById(
      "coins").innerText = coins;

      document.getElementById(
      "energy").innerText = energy;

      document.getElementById(
      "xpFill"
      ).style.width =
      xp + "%";

    }

    // GAME LOOP

    function loop(){

      update();
      draw();

      requestAnimationFrame(
      loop
      );

    }

    loop();

    // RESIZE

    window.addEventListener(
      "resize",
      ()=>{

        canvas.width =
        window.innerWidth;

        canvas.height =
        window.innerHeight;

      }
    );

  </script>

</body>
</html>
