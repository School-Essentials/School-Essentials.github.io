<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>School Essentials MMORPG</title>

<link rel="icon"
type="image/png"
href="favicon.png">

<!-- ADSENSE -->

<script async
src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613"
crossorigin="anonymous"></script>

<meta name="google-adsense-account"
content="ca-pub-4335653991954613">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#020617;
color:white;
}

/* GAME */

canvas{
display:block;
background:#0b1220;
}

/* HUD */

.hud{

position:fixed;

top:15px;
left:15px;

width:320px;

background:rgba(15,23,42,0.95);

border:2px solid #1e293b;

border-radius:20px;

padding:18px;

z-index:999;

backdrop-filter:blur(10px);

}

.hud h1{
color:#f97316;
margin-bottom:15px;
font-size:1.8rem;
}

.stat{
margin-bottom:10px;
color:#e2e8f0;
}

.bar{

width:100%;
height:18px;

background:#1e293b;

border-radius:20px;

overflow:hidden;

margin-top:6px;

}

.fill{
height:100%;
width:100%;
transition:0.3s;
}

.health-fill{
background:#ef4444;
}

.xp-fill{
background:#f97316;
}

/* INVENTORY */

.inventory{

position:fixed;

right:15px;
bottom:15px;

width:300px;

background:rgba(15,23,42,0.95);

border:2px solid #1e293b;

border-radius:20px;

padding:15px;

z-index:999;

}

.inventory h2{
color:#f97316;
margin-bottom:12px;
}

.item{
background:#1e293b;
padding:10px;
border-radius:12px;
margin-bottom:8px;
}

/* ADS */

.ads-panel{

position:fixed;

top:15px;
right:15px;

width:320px;

background:rgba(15,23,42,0.95);

border:2px solid #1e293b;

border-radius:20px;

padding:15px;

z-index:999;

}

.ads-title{
text-align:center;
color:#f97316;
margin-bottom:10px;
font-weight:bold;
}

/* DIALOG */

.dialogue{

position:fixed;

bottom:20px;
left:50%;

transform:translateX(-50%);

width:850px;
max-width:92%;

background:rgba(15,23,42,0.98);

border:2px solid #f97316;

border-radius:20px;

padding:20px;

display:none;

z-index:9999;

}

.dialogue-name{
color:#f97316;
font-size:1.2rem;
font-weight:bold;
margin-bottom:10px;
}

.dialogue-text{
color:#e2e8f0;
line-height:1.5;
}

/* CONTROLS */

.controls{

position:fixed;

left:15px;
bottom:15px;

background:rgba(15,23,42,0.95);

border:2px solid #1e293b;

border-radius:20px;

padding:14px;

z-index:999;

color:#cbd5e1;

}

/* SAVE */

.save-btn{

margin-top:15px;

width:100%;

padding:12px;

background:#f97316;

border:none;

border-radius:12px;

color:white;

font-weight:bold;

cursor:pointer;

}

.save-btn:hover{
background:#ea580c;
}

</style>

</head>

<body>

<!-- HUD -->

<div class="hud">

<h1>🎒 School Essentials</h1>

<div class="stat">
Level:
<span id="level">1</span>
</div>

<div class="stat">
Gold:
<span id="gold">0</span>
</div>

<div class="stat">
Weapon:
<span id="weapon">Pencil</span>
</div>

<div class="stat">
Armor:
<span id="armor">Hoodie</span>
</div>

<div class="stat">
Health
<div class="bar">
<div class="fill health-fill"
id="healthFill"></div>
</div>
</div>

<div class="stat">
XP
<div class="bar">
<div class="fill xp-fill"
id="xpFill"></div>
</div>
</div>

<button
class="save-btn"
onclick="saveGame()">

💾 Save Game

</button>

</div>

<!-- ADS -->

<div class="ads-panel">

<div class="ads-title">
Sponsored
</div>

<ins class="adsbygoogle"
style="display:block"
data-ad-client="ca-pub-4335653991954613"
data-ad-slot="1234567890"
data-ad-format="auto"
data-full-width-responsive="true"></ins>

</div>

<!-- INVENTORY -->

<div class="inventory">

<h2>🎒 Inventory</h2>

<div class="item">
✏ Pencil Sword
</div>

<div class="item">
📘 Textbook Shield
</div>

<div class="item">
🥤 Energy Drink
</div>

<div class="item">
🧪 Science Potion
</div>

</div>

<!-- DIALOG -->

<div class="dialogue"
id="dialogue">

<div class="dialogue-name"
id="dialogueName">

NPC

</div>

<div class="dialogue-text"
id="dialogueText">

Hello.

</div>

</div>

<!-- CONTROLS -->

<div class="controls">

WASD = Move<br>
SHIFT = Sprint<br>
E = Interact / Attack

</div>

<!-- GAME -->

<canvas id="game"></canvas>

<script>

(adsbygoogle =
window.adsbygoogle || []).push({});

// CANVAS

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

// PLAYER

const player = {

x:400,
y:400,

size:38,

speed:4,

health:100,

xp:0,

level:1,

gold:0,

weapon:"Pencil",

armor:"Hoodie",

color:"#f97316"

};

// KEYS

const keys = {};

document.addEventListener(
"keydown",
e=>{

keys[e.key.toLowerCase()] = true;

});

document.addEventListener(
"keyup",
e=>{

keys[e.key.toLowerCase()] = false;

});

// MAP

const buildings = [

{
x:100,
y:100,
w:400,
h:260,
name:"Math Hall",
color:"#1e293b"
},

{
x:650,
y:100,
w:450,
h:260,
name:"Blacksmith",
color:"#3f3f46"
},

{
x:100,
y:450,
w:400,
h:260,
name:"Cafeteria",
color:"#14532d"
},

{
x:650,
y:450,
w:450,
h:260,
name:"Science Lab",
color:"#1d4ed8"
}

];

// NPCS

const npcs = [

{
x:820,
y:220,
name:"Blacksmith",
text:"Upgrade your weapon for 25 gold.",
color:"#a16207"
},

{
x:300,
y:220,
name:"Math Teacher",
text:"Defeat students to earn XP.",
color:"#38bdf8"
},

{
x:280,
y:560,
name:"Lunch Lady",
text:"Buy snacks to restore health.",
color:"#22c55e"
}

];

// ENEMIES

const enemies = [

{
x:1200,
y:400,
health:40,
color:"#ef4444"
},

{
x:950,
y:650,
health:40,
color:"#ef4444"
}

];

// UPDATE

function update(){

let speed =
keys["shift"] ? 7 : 4;

if(keys["w"]){
player.y -= speed;
}

if(keys["s"]){
player.y += speed;
}

if(keys["a"]){
player.x -= speed;
}

if(keys["d"]){
player.x += speed;
}

// INTERACT

if(keys["e"]){

// NPCS

npcs.forEach(npc=>{

let dx =
player.x - npc.x;

let dy =
player.y - npc.y;

let dist =
Math.sqrt(dx*dx + dy*dy);

if(dist < 80){

showDialogue(
npc.name,
npc.text
);

// BLACKSMITH

if(npc.name === "Blacksmith"){

if(player.gold >= 25){

player.gold -= 25;

player.weapon =
"Golden Ruler";

showDialogue(
"Blacksmith",
"Your weapon was upgraded!"
);

}

}

}

});

// ENEMIES

enemies.forEach(enemy=>{

let dx =
player.x - enemy.x;

let dy =
player.y - enemy.y;

let dist =
Math.sqrt(dx*dx + dy*dy);

if(dist < 80){

enemy.health -= 10;

if(enemy.health <= 0){

player.gold += 15;
player.xp += 25;

enemy.x =
Math.random() * 1400;

enemy.y =
Math.random() * 800;

enemy.health = 40;

if(player.xp >= 100){

player.level++;
player.xp = 0;

}

updateHUD();

}

}

});

}

}

// DRAW

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

// FLOOR

for(let x=0;
x<canvas.width;
x+=80){

for(let y=0;
y<canvas.height;
y+=80){

ctx.fillStyle =
(x+y)%160===0
? "#0f172a"
: "#111827";

ctx.fillRect(
x,
y,
80,
80
);

}

}

// BUILDINGS

buildings.forEach(building=>{

ctx.fillStyle =
building.color;

ctx.fillRect(
building.x,
building.y,
building.w,
building.h
);

ctx.strokeStyle =
"#f97316";

ctx.lineWidth = 4;

ctx.strokeRect(
building.x,
building.y,
building.w,
building.h
);

ctx.fillStyle =
"white";

ctx.font =
"28px Arial";

ctx.fillText(
building.name,
building.x + 20,
building.y + 40
);

});

// NPCS

npcs.forEach(npc=>{

ctx.fillStyle =
npc.color;

ctx.fillRect(
npc.x,
npc.y,
40,
40
);

ctx.fillStyle =
"white";

ctx.font =
"16px Arial";

ctx.fillText(
npc.name,
npc.x - 10,
npc.y - 10
);

});

// ENEMIES

enemies.forEach(enemy=>{

ctx.fillStyle =
enemy.color;

ctx.fillRect(
enemy.x,
enemy.y,
35,
35
);

ctx.fillStyle =
"white";

ctx.fillText(
"Troublemaker",
enemy.x - 10,
enemy.y - 10
);

});

// PLAYER

ctx.fillStyle =
player.color;

ctx.fillRect(
player.x,
player.y,
player.size,
player.size
);

ctx.fillStyle =
"white";

ctx.font =
"18px Arial";

ctx.fillText(
"YOU",
player.x,
player.y - 10
);

}

// DIALOG

function showDialogue(name,text){

const box =
document.getElementById(
"dialogue"
);

document.getElementById(
"dialogueName"
).innerText = name;

document.getElementById(
"dialogueText"
).innerText = text;

box.style.display = "block";

clearTimeout(
window.dialogTimeout
);

window.dialogTimeout =
setTimeout(()=>{

box.style.display = "none";

},4000);

}

// HUD

function updateHUD(){

document.getElementById(
"level"
).innerText =
player.level;

document.getElementById(
"gold"
).innerText =
player.gold;

document.getElementById(
"weapon"
).innerText =
player.weapon;

document.getElementById(
"armor"
).innerText =
player.armor;

document.getElementById(
"healthFill"
).style.width =
player.health + "%";

document.getElementById(
"xpFill"
).style.width =
player.xp + "%";

}

// SAVE SYSTEM

function saveGame(){

localStorage.setItem(
"schoolEssentialsSave",

JSON.stringify(player)

);

showDialogue(
"Game Saved",
"Your progress was saved."
);

}

// LOAD

function loadGame(){

const save =
localStorage.getItem(
"schoolEssentialsSave"
);

if(save){

const data =
JSON.parse(save);

Object.assign(
player,
data
);

updateHUD();

}

}

loadGame();

// LOOP

function gameLoop(){

update();
draw();

requestAnimationFrame(
gameLoop
);

}

gameLoop();

// RESIZE

window.addEventListener(
"resize",
()=>{

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

});

</script>

</body>
</html>
