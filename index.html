<!DOCTYPE html>
<html lang="en">
<head>

  <!-- GOOGLE ADSENSE -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613"
    crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Essentials MMO RPG</title>

  <meta name="google-adsense-account"
        content="ca-pub-4335653991954613">

  <link rel="icon" type="image/png" href="favicon.png">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      overflow:hidden;
      background:#0f172a;
      color:white;
    }

    canvas{
      display:block;
      background:#4ade80;
    }

    /* TOP HUD */

    #topHud{
      position:fixed;
      top:12px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:12px;
      z-index:1000;
    }

    .hudBox{
      background:rgba(15,23,42,0.95);
      border:2px solid #f97316;
      border-radius:14px;
      padding:10px 18px;
      font-weight:bold;
      font-size:1rem;
    }

    /* QUEST */

    #questBox{
      position:fixed;
      top:90px;
      left:15px;
      width:260px;

      background:rgba(15,23,42,0.95);

      border:2px solid #f97316;

      border-radius:16px;

      padding:16px;

      z-index:1000;
    }

    #questBox h2{
      color:#f97316;
      margin-bottom:10px;
    }

    /* INVENTORY */

    #inventory{
      position:fixed;
      right:15px;
      bottom:110px;

      width:320px;

      background:rgba(15,23,42,0.96);

      border:2px solid #f97316;

      border-radius:16px;

      padding:15px;

      z-index:1000;
    }

    #inventory h2{
      color:#f97316;
      margin-bottom:12px;
    }

    .inventoryGrid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .itemSlot{
      width:65px;
      height:65px;

      background:#1e293b;

      border:2px solid #334155;

      border-radius:12px;

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:1.8rem;
    }

    /* HOTBAR */

    #hotbar{
      position:fixed;
      bottom:15px;
      left:50%;
      transform:translateX(-50%);

      display:flex;
      gap:6px;

      z-index:1000;
    }

    .hotbarSlot{
      width:65px;
      height:65px;

      background:#1e293b;

      border:3px solid #334155;

      border-radius:12px;

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:1.6rem;
    }

    .selected{
      border-color:#f97316;
    }

    /* TAB MENU */

    #tabMenu{
      position:fixed;
      inset:0;

      background:rgba(0,0,0,0.82);

      z-index:9999;

      display:none;

      justify-content:center;
      align-items:center;
    }

    .tabInner{
      width:75%;
      max-width:900px;

      background:#0f172a;

      border:3px solid #f97316;

      border-radius:20px;

      padding:35px;
    }

    .tabInner h1{
      color:#f97316;
      margin-bottom:25px;
    }

    .statGrid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
    }

    .statCard{
      background:#1e293b;
      border-radius:14px;
      padding:18px;
      font-size:1.1rem;
    }

    /* ADS */

    .adBox{
      position:fixed;
      top:120px;

      width:160px;
      height:600px;

      background:#0f172a;

      border:2px dashed #334155;

      display:flex;
      justify-content:center;
      align-items:center;

      text-align:center;

      color:#94a3b8;

      padding:10px;

      z-index:500;
    }

    .leftAd{
      left:10px;
    }

    .rightAd{
      right:10px;
    }

    /* DIALOG */

    #dialogBox{
      position:fixed;
      bottom:100px;
      left:50%;
      transform:translateX(-50%);

      width:500px;
      max-width:90%;

      background:rgba(15,23,42,0.96);

      border:2px solid #f97316;

      border-radius:16px;

      padding:18px;

      display:none;

      z-index:9999;
    }

    #dialogName{
      color:#f97316;
      font-weight:bold;
      margin-bottom:10px;
      font-size:1.1rem;
    }

    /* MOBILE */

    @media(max-width:1200px){

      .adBox{
        display:none;
      }

    }

    @media(max-width:800px){

      #inventory{
        width:260px;
      }

      .itemSlot,
      .hotbarSlot{
        width:50px;
        height:50px;
      }

    }

  </style>

</head>

<body>

  <!-- ADS -->

  <div class="adBox leftAd">
    Google AdSense Space
  </div>

  <div class="adBox rightAd">
    Google AdSense Space
  </div>

  <!-- HUD -->

  <div id="topHud">

    <div class="hudBox">
      ❤️ <span id="healthText">100</span>
    </div>

    <div class="hudBox">
      🪙 <span id="coinText">0</span>
    </div>

    <div class="hudBox">
      ⭐ LVL <span id="levelText">1</span>
    </div>

    <div class="hudBox">
      XP <span id="xpText">0 / 100</span>
    </div>

  </div>

  <!-- QUEST -->

  <div id="questBox">

    <h2>📜 Quest</h2>

    <p id="questText">
      Talk to the Teacher.
    </p>

  </div>

  <!-- INVENTORY -->

  <div id="inventory">

    <h2>🎒 Inventory</h2>

    <div class="inventoryGrid">

      <div class="itemSlot">⚔️</div>
      <div class="itemSlot">🛡️</div>
      <div class="itemSlot">🧪</div>
      <div class="itemSlot">📘</div>

      <div class="itemSlot">🍎</div>
      <div class="itemSlot">💎</div>
      <div class="itemSlot">🏹</div>
      <div class="itemSlot">🪓</div>

    </div>

  </div>

  <!-- HOTBAR -->

  <div id="hotbar">

    <div class="hotbarSlot selected">⚔️</div>
    <div class="hotbarSlot">🧪</div>
    <div class="hotbarSlot">🍎</div>
    <div class="hotbarSlot"></div>
    <div class="hotbarSlot"></div>
    <div class="hotbarSlot"></div>
    <div class="hotbarSlot"></div>
    <div class="hotbarSlot"></div>
    <div class="hotbarSlot"></div>

  </div>

  <!-- TAB MENU -->

  <div id="tabMenu">

    <div class="tabInner">

      <h1>School Essentials</h1>

      <div class="statGrid">

        <div class="statCard">
          Level: <span id="tabLevel">1</span>
        </div>

        <div class="statCard">
          XP: <span id="tabXP">0 / 100</span>
        </div>

      </div>

    </div>

  </div>

  <!-- DIALOG -->

  <div id="dialogBox">

    <div id="dialogName">
      NPC
    </div>

    <div id="dialogText">
      Hello!
    </div>

  </div>

  <!-- GAME -->

  <canvas id="gameCanvas"></canvas>

  <script>

    const canvas =
    document.getElementById("gameCanvas");

    const ctx =
    canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let player = {

      x:1500,
      y:1500,

      size:36,

      speed:4,

      health:100,

      coins:0,

      xp:0,

      level:1

    };

    const keys = {};

    document.addEventListener(
    "keydown",
    e=>{

      keys[e.key.toLowerCase()] = true;

      if(e.key === "Tab"){

        e.preventDefault();

        document.getElementById(
        "tabMenu"
        ).style.display = "flex";

      }

    });

    document.addEventListener(
    "keyup",
    e=>{

      keys[e.key.toLowerCase()] = false;

      if(e.key === "Tab"){

        document.getElementById(
        "tabMenu"
        ).style.display = "none";

      }

    });

    const mapObjects = [];

    for(let i=0;i<150;i++){

      mapObjects.push({

        x:Math.random()*4000,
        y:Math.random()*4000,

        size:40 + Math.random()*60,

        type:Math.random() > 0.5
        ? "tree"
        : "rock"

      });

    }

    const buildings = [

      {
        x:1200,
        y:1300,
        w:300,
        h:220,
        color:"#64748b",
        name:"School"
      },

      {
        x:1800,
        y:1100,
        w:260,
        h:200,
        color:"#92400e",
        name:"Blacksmith"
      },

      {
        x:2300,
        y:1700,
        w:320,
        h:260,
        color:"#1d4ed8",
        name:"Dungeon"
      }

    ];

    const npcs = [

      {
        x:1400,
        y:1450,
        color:"#f97316",
        name:"Teacher",
        text:"Defeat enemies and level up!"
      },

      {
        x:1900,
        y:1200,
        color:"#9ca3af",
        name:"Blacksmith",
        text:"I will upgrade your gear soon."
      }

    ];

    const enemies = [];

    for(let i=0;i<25;i++){

      enemies.push({

        x:Math.random()*3500,
        y:Math.random()*3500,

        size:34,

        hp:50

      });

    }

    function drawMap(cameraX,cameraY){

      ctx.fillStyle = "#4ade80";

      ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
      );

      /* PATHS */

      ctx.fillStyle="#d6d3d1";

      ctx.fillRect(
      -cameraX + 1000,
      -cameraY + 1450,
      2000,
      120
      );

      ctx.fillRect(
      -cameraX + 1450,
      -cameraY + 600,
      120,
      2200
      );

      /* TREES + ROCKS */

      mapObjects.forEach(obj=>{

        if(obj.type === "tree"){

          ctx.fillStyle="#166534";

          ctx.beginPath();

          ctx.arc(
          obj.x-cameraX,
          obj.y-cameraY,
          obj.size/2,
          0,
          Math.PI*2
          );

          ctx.fill();

        }

        else{

          ctx.fillStyle="#6b7280";

          ctx.fillRect(
          obj.x-cameraX,
          obj.y-cameraY,
          obj.size,
          obj.size
          );

        }

      });

      /* BUILDINGS */

      buildings.forEach(building=>{

        ctx.fillStyle =
        building.color;

        ctx.fillRect(
        building.x-cameraX,
        building.y-cameraY,
        building.w,
        building.h
        );

        ctx.fillStyle="white";

        ctx.font="22px Arial";

        ctx.fillText(
        building.name,
        building.x-cameraX+20,
        building.y-cameraY-10
        );

      });

    }

    function drawPlayer(cameraX,cameraY){

      ctx.fillStyle="#2563eb";

      ctx.fillRect(
      player.x-cameraX,
      player.y-cameraY,
      player.size,
      player.size
      );

    }

    function drawNPCs(cameraX,cameraY){

      npcs.forEach(npc=>{

        ctx.fillStyle =
        npc.color;

        ctx.fillRect(
        npc.x-cameraX,
        npc.y-cameraY,
        36,
        36
        );

        ctx.fillStyle="black";

        ctx.font="16px Arial";

        ctx.fillText(
        npc.name,
        npc.x-cameraX-10,
        npc.y-cameraY-10
        );

      });

    }

    function drawEnemies(cameraX,cameraY){

      enemies.forEach(enemy=>{

        ctx.fillStyle="#dc2626";

        ctx.fillRect(
        enemy.x-cameraX,
        enemy.y-cameraY,
        enemy.size,
        enemy.size
        );

      });

    }

    function movePlayer(){

      if(keys["w"]){
        player.y -= player.speed;
      }

      if(keys["s"]){
        player.y += player.speed;
      }

      if(keys["a"]){
        player.x -= player.speed;
      }

      if(keys["d"]){
        player.x += player.speed;
      }

    }

    function npcInteraction(){

      npcs.forEach(npc=>{

        let dx =
        player.x - npc.x;

        let dy =
        player.y - npc.y;

        let dist =
        Math.sqrt(dx*dx + dy*dy);

        if(dist < 80){

          document.getElementById(
          "dialogBox"
          ).style.display = "block";

          document.getElementById(
          "dialogName"
          ).innerText = npc.name;

          document.getElementById(
          "dialogText"
          ).innerText = npc.text;

        }

      });

    }

    function hideDialog(){

      let nearNPC = false;

      npcs.forEach(npc=>{

        let dx =
        player.x - npc.x;

        let dy =
        player.y - npc.y;

        let dist =
        Math.sqrt(dx*dx + dy*dy);

        if(dist < 80){
          nearNPC = true;
        }

      });

      if(!nearNPC){

        document.getElementById(
        "dialogBox"
        ).style.display = "none";

      }

    }

    function attackEnemies(){

      enemies.forEach(enemy=>{

        let dx =
        player.x - enemy.x;

        let dy =
        player.y - enemy.y;

        let dist =
        Math.sqrt(dx*dx + dy*dy);

        if(dist < 70 && keys[" "]){

          enemy.hp -= 1;

          if(enemy.hp <= 0){

            player.coins += 10;
            player.xp += 25;

            enemy.x =
            Math.random()*3500;

            enemy.y =
            Math.random()*3500;

            enemy.hp = 50;

          }

        }

      });

    }

    function levelSystem(){

      let needed =
      player.level * 100;

      if(player.xp >= needed){

        player.level++;

        player.xp = 0;

        player.health = 100;

      }

    }

    function updateHUD(){

      document.getElementById(
      "healthText"
      ).innerText = player.health;

      document.getElementById(
      "coinText"
      ).innerText = player.coins;

      document.getElementById(
      "levelText"
      ).innerText = player.level;

      document.getElementById(
      "xpText"
      ).innerText =
      player.xp + " / " +
      (player.level*100);

      document.getElementById(
      "tabLevel"
      ).innerText = player.level;

      document.getElementById(
      "tabXP"
      ).innerText =
      player.xp + " / " +
      (player.level*100);

    }

    function saveGame(){

      localStorage.setItem(
      "schoolMMORPGSave",
      JSON.stringify(player)
      );

    }

    function loadGame(){

      let save =
      localStorage.getItem(
      "schoolMMORPGSave"
      );

      if(save){

        player =
        JSON.parse(save);

      }

    }

    loadGame();

    setInterval(saveGame,3000);

    function gameLoop(){

      movePlayer();

      npcInteraction();

      hideDialog();

      attackEnemies();

      levelSystem();

      updateHUD();

      const cameraX =
      player.x - canvas.width/2;

      const cameraY =
      player.y - canvas.height/2;

      drawMap(cameraX,cameraY);

      drawEnemies(cameraX,cameraY);

      drawNPCs(cameraX,cameraY);

      drawPlayer(cameraX,cameraY);

      requestAnimationFrame(gameLoop);

    }

    gameLoop();

  </script>

</body>
</html>
