<!DOCTYPE html>
<html lang="en">
<head>

  <!-- ADSENSE -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613"
    crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Essentials MMORPG</title>

  <meta name="google-adsense-account"
        content="ca-pub-4335653991954613">

  <link rel="icon" href="favicon.png">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      overflow:hidden;
      background:#0f172a;
    }

    canvas{
      display:block;
      background:#3b7a44;
      image-rendering:pixelated;
    }

    /* TAB MENU */

    .tab-menu{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.9);
      z-index:5000;

      display:none;
      align-items:center;
      justify-content:center;
    }

    .menu{
      width:92%;
      max-width:1200px;

      background:#111827;

      border:2px solid #334155;

      border-radius:25px;

      padding:30px;
    }

    .menu h1{
      text-align:center;
      color:#f97316;
      margin-bottom:25px;
      font-size:2.8rem;
    }

    .menu-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:20px;
    }

    .box{
      background:#1e293b;
      border-radius:18px;
      padding:20px;
      border:1px solid #334155;
    }

    .box h2{
      color:#f97316;
      margin-bottom:15px;
    }

    .item{
      background:#0f172a;
      padding:12px;
      border-radius:12px;
      margin-bottom:10px;
      color:white;
    }

    .btn{
      background:#f97316;
      border:none;
      color:white;
      padding:12px 16px;
      border-radius:12px;
      font-weight:bold;
      cursor:pointer;
      width:100%;
      margin-top:10px;
    }

    .btn:hover{
      background:#ea580c;
    }

    /* HOTBAR */

    .hotbar{
      position:fixed;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);

      display:flex;
      gap:10px;

      z-index:1000;
    }

    .slot{
      width:70px;
      height:70px;

      background:#111827;

      border:3px solid #334155;

      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:white;
      font-size:1.6rem;
    }

    .selected{
      border-color:#f97316;
    }

    /* PLAYER STATS */

    .player-ui{
      position:fixed;
      bottom:105px;
      left:50%;
      transform:translateX(-50%);

      background:rgba(15,23,42,0.95);

      border:2px solid #334155;

      border-radius:18px;

      padding:10px 18px;

      display:flex;
      gap:18px;

      color:white;

      z-index:1000;
    }

    .stat{
      font-weight:bold;
    }

    .xp-bar{
      position:fixed;
      bottom:155px;
      left:50%;
      transform:translateX(-50%);

      width:320px;
      height:18px;

      background:#1e293b;

      border-radius:10px;

      overflow:hidden;

      z-index:1000;
    }

    .xp-fill{
      height:100%;
      width:0%;
      background:#f97316;
    }

    /* ADS */

    .ad-box{
      margin-top:15px;
      background:#0f172a;
      padding:12px;
      border-radius:12px;
    }

    /* HELP */

    .help{
      position:fixed;
      top:15px;
      left:15px;

      background:rgba(15,23,42,0.95);

      border:1px solid #334155;

      padding:12px;

      border-radius:14px;

      color:white;

      line-height:1.5;

      z-index:1000;
    }

  </style>

</head>

<body>

  <!-- HELP -->

  <div class="help">
    WASD = Move<br>
    SHIFT = Sprint<br>
    E = Attack<br>
    TAB = Open Menu
  </div>

  <!-- TAB MENU -->

  <div class="tab-menu" id="tabMenu">

    <div class="menu">

      <h1>School Essentials</h1>

      <div class="menu-grid">

        <!-- PLAYER -->

        <div class="box">

          <h2>Player</h2>

          <div class="item">
            Level:
            <span id="levelText">1</span>
          </div>

          <div class="item">
            XP:
            <span id="xpText">0</span>/100
          </div>

        </div>

        <!-- INVENTORY -->

        <div class="box">

          <h2>Inventory</h2>

          <div id="inventory">

            <div class="item">
              📘 Starter Book
            </div>

            <div class="item">
              ✏️ Pencil Sword
            </div>

          </div>

        </div>

        <!-- BLACKSMITH -->

        <div class="box">

          <h2>Blacksmith</h2>

          <button class="btn"
          onclick="upgradeSword()">

            Upgrade Sword - 50 Coins

          </button>

          <button class="btn"
          onclick="healPlayer()">

            Heal - 25 Coins

          </button>

        </div>

        <!-- ADS -->

        <div class="box">

          <h2>Sponsored</h2>

          <div class="ad-box">

            <ins class="adsbygoogle"
              style="display:block"
              data-ad-client="ca-pub-4335653991954613"
              data-ad-slot="1234567890"
              data-ad-format="auto"
              data-full-width-responsive="true"></ins>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- XP -->

  <div class="xp-bar">
    <div class="xp-fill" id="xpFill"></div>
  </div>

  <!-- PLAYER UI -->

  <div class="player-ui">

    <div class="stat">
      ❤️
      <span id="healthText">100</span>
    </div>

    <div class="stat">
      💰
      <span id="coinsText">0</span>
    </div>

  </div>

  <!-- HOTBAR -->

  <div class="hotbar">

    <div class="slot selected">
      ⚔️
    </div>

    <div class="slot">
      🧪
    </div>

    <div class="slot">
      🛡️
    </div>

    <div class="slot">
      🍎
    </div>

    <div class="slot">
      📘
    </div>

  </div>

  <!-- GAME -->

  <canvas id="game"></canvas>

  <script>

    (adsbygoogle = window.adsbygoogle || []).push({});

    const canvas =
    document.getElementById("game");

    const ctx =
    canvas.getContext("2d");

    canvas.width = innerWidth;
    canvas.height = innerHeight;

    // PLAYER

    const player = {

      x:900,
      y:900,

      size:32,

      speed:4,

      health:100,

      coins:0,

      xp:0,

      level:1,

      damage:1

    };

    // CAMERA

    const camera = {

      x:0,
      y:0

    };

    // KEYS

    const keys = {};

    addEventListener("keydown",e=>{

      keys[e.key.toLowerCase()] = true;

      if(e.key === "Tab"){

        e.preventDefault();

        document.getElementById(
          "tabMenu"
        ).style.display = "flex";

      }

    });

    addEventListener("keyup",e=>{

      keys[e.key.toLowerCase()] = false;

      if(e.key === "Tab"){

        document.getElementById(
          "tabMenu"
        ).style.display = "none";

      }

    });

    // REAL MAP

    const buildings = [

      {
        x:500,
        y:500,
        w:600,
        h:400,
        color:"#475569",
        name:"School"
      },

      {
        x:1500,
        y:700,
        w:400,
        h:300,
        color:"#334155",
        name:"Library"
      },

      {
        x:2500,
        y:500,
        w:450,
        h:350,
        color:"#1e293b",
        name:"Blacksmith"
      },

      {
        x:2200,
        y:1800,
        w:650,
        h:500,
        color:"#475569",
        name:"Gym"
      },

      {
        x:700,
        y:2100,
        w:500,
        h:350,
        color:"#334155",
        name:"Cafeteria"
      }

    ];

    // ENEMIES

    const enemies = [];

    for(let i=0;i<20;i++){

      enemies.push({

        x:Math.random()*3200,
        y:Math.random()*3200,

        size:28,

        health:5

      });

    }

    // SAVE SYSTEM

    function saveGame(){

      localStorage.setItem(
        "schoolSave",

        JSON.stringify(player)

      );

    }

    function loadGame(){

      const save =
      localStorage.getItem(
        "schoolSave"
      );

      if(save){

        Object.assign(
          player,
          JSON.parse(save)
        );

      }

    }

    loadGame();

    setInterval(saveGame,5000);

    // UPGRADES

    function upgradeSword(){

      if(player.coins >= 50){

        player.coins -= 50;

        player.damage++;

      }

    }

    function healPlayer(){

      if(player.coins >= 25){

        player.coins -= 25;

        player.health = 100;

      }

    }

    // UI

    function updateUI(){

      document.getElementById(
        "healthText"
      ).innerText =
      Math.floor(player.health);

      document.getElementById(
        "coinsText"
      ).innerText =
      player.coins;

      document.getElementById(
        "levelText"
      ).innerText =
      player.level;

      document.getElementById(
        "xpText"
      ).innerText =
      player.xp;

      document.getElementById(
        "xpFill"
      ).style.width =
      player.xp + "%";

    }

    // UPDATE

    function update(){

      let speed =
      keys["shift"] ? 7 : 4;

      if(keys["w"]) player.y -= speed;
      if(keys["s"]) player.y += speed;
      if(keys["a"]) player.x -= speed;
      if(keys["d"]) player.x += speed;

      camera.x =
      player.x - canvas.width/2;

      camera.y =
      player.y - canvas.height/2;

      enemies.forEach(enemy=>{

        let dx =
        player.x - enemy.x;

        let dy =
        player.y - enemy.y;

        let dist =
        Math.sqrt(dx*dx + dy*dy);

        if(dist < 250){

          enemy.x += dx/dist;
          enemy.y += dy/dist;

        }

        if(dist < 35){

          player.health -= 0.05;

        }

        // ATTACK

        if(keys["e"] && dist < 60){

          enemy.health -= player.damage;

          if(enemy.health <= 0){

            enemy.x =
            Math.random()*3200;

            enemy.y =
            Math.random()*3200;

            enemy.health = 5;

            player.coins += 10;
            player.xp += 10;

            if(player.xp >= 100){

              player.level++;
              player.xp = 0;

            }

          }

        }

      });

      updateUI();

    }

    // DRAW

    function draw(){

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      // GRASS

      ctx.fillStyle = "#3b7a44";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      // ROADS

      ctx.fillStyle = "#6b7280";

      ctx.fillRect(
        -camera.x,
        1000-camera.y,
        4000,
        140
      );

      ctx.fillRect(
        1800-camera.x,
        -camera.y,
        140,
        4000
      );

      // TREES

      for(let i=0;i<80;i++){

        let tx =
        (i*280)%3800;

        let ty =
        Math.floor(i/8)*300;

        ctx.fillStyle = "#14532d";

        ctx.beginPath();

        ctx.arc(
          tx-camera.x,
          ty-camera.y,
          40,
          0,
          Math.PI*2
        );

        ctx.fill();

      }

      // BUILDINGS

      buildings.forEach(building=>{

        ctx.fillStyle =
        building.color;

        ctx.fillRect(
          building.x-camera.x,
          building.y-camera.y,
          building.w,
          building.h
        );

        ctx.fillStyle = "white";

        ctx.font = "24px Arial";

        ctx.fillText(
          building.name,
          building.x-camera.x+20,
          building.y-camera.y+40
        );

      });

      // ENEMIES

      enemies.forEach(enemy=>{

        ctx.fillStyle = "#dc2626";

        ctx.fillRect(
          enemy.x-camera.x,
          enemy.y-camera.y,
          enemy.size,
          enemy.size
        );

      });

      // PLAYER

      ctx.fillStyle = "#f97316";

      ctx.fillRect(
        player.x-camera.x,
        player.y-camera.y,
        player.size,
        player.size
      );

    }

    // GAME LOOP

    function loop(){

      update();
      draw();

      requestAnimationFrame(loop);

    }

    updateUI();
    loop();

    // RESIZE

    addEventListener("resize",()=>{

      canvas.width = innerWidth;
      canvas.height = innerHeight;

    });

  </script>

</body>
</html>
