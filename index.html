<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#0b1220;
color:white;
}

/* WORLD */

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
}

#world{
position:absolute;
width:5000px;
height:5000px;

background:
linear-gradient(
to bottom,
#2d8b57,
#246c45
);
}

/* ROADS */

.road{
position:absolute;
background:#8b7355;
}

/* WATER */

.water{
position:absolute;
background:#3399ff;
border-radius:12px;
}

/* BUILDINGS */

.building{
position:absolute;
background:#d1d5db;
border:6px solid #6b7280;
border-radius:18px;
}

.school-label{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:30px;
font-weight:bold;
color:#111827;
}

/* TREES */

.tree{
position:absolute;
width:90px;
height:90px;
background:#1d7a37;
border-radius:50%;
}

.tree::after{
content:'';
position:absolute;
width:18px;
height:45px;
background:#5b3a1d;
left:36px;
top:60px;
}

/* PLAYER */

#player{
position:absolute;
width:64px;
height:64px;
background:#3b82f6;
border-radius:14px;
border:4px solid white;
z-index:100;
transition:0.05s linear;
}

#player::after{
content:'';
position:absolute;
width:22px;
height:22px;
background:#93c5fd;
border-radius:50%;
top:8px;
left:18px;
}

/* NPC */

.npc{
position:absolute;
width:60px;
height:60px;
background:#f59e0b;
border-radius:50%;
border:4px solid white;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:20px;
}

/* ENEMIES */

.enemy{
position:absolute;
width:60px;
height:60px;
background:#dc2626;
border-radius:14px;
border:4px solid white;
}

/* HUD */

#topHud{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:14px;
z-index:999;
}

.hudBox{
background:rgba(15,23,42,0.9);
padding:12px 18px;
border-radius:14px;
border:2px solid #334155;
font-weight:bold;
}

/* QUEST */

#quest{
position:fixed;
top:80px;
left:50%;
transform:translateX(-50%);
background:rgba(15,23,42,0.95);
padding:14px 20px;
border-radius:14px;
border:2px solid #334155;
z-index:999;
}

/* HOTBAR */

#hotbar{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
z-index:999;
}

.slot{
width:70px;
height:70px;
background:#1e293b;
border:3px solid #475569;
border-radius:14px;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
transition:0.15s;
}

.slot.active{
border-color:#f97316;
transform:translateY(-5px);
}

/* INVENTORY */

#inventory{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:650px;
background:rgba(15,23,42,0.97);
padding:25px;
border-radius:22px;
border:3px solid #334155;
display:none;
z-index:3000;
}

#inventoryGrid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:10px;
margin-top:20px;
}

.invSlot{
height:80px;
background:#1e293b;
border:2px solid #475569;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
}

/* TAB MENU */

#tabMenu{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
z-index:4000;
}

#tabContent{
width:400px;
background:#0f172a;
padding:35px;
border-radius:24px;
border:3px solid #334155;
text-align:center;
}

/* ADS */

#adLeft,
#adRight{
position:fixed;
top:120px;
width:160px;
height:600px;
background:#111827;
border-radius:18px;
border:2px solid #1e293b;
padding:10px;
z-index:500;
}

#adLeft{
left:10px;
}

#adRight{
right:10px;
}

/* REWARD */

#rewardBtn{
position:fixed;
right:30px;
bottom:120px;
padding:16px 22px;
background:#f97316;
border:none;
border-radius:16px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
z-index:1000;
}

#rewardBtn:hover{
background:#ea580c;
}

/* DAMAGE TEXT */

#damageText{
position:fixed;
top:140px;
left:50%;
transform:translateX(-50%);
font-size:34px;
font-weight:bold;
color:#ff6666;
z-index:5000;
pointer-events:none;
}

/* MOBILE */

@media(max-width:1000px){

#adLeft,
#adRight{
display:none;
}

}

</style>
</head>

<script>

/* ADS */

(adsbygoogle = window.adsbygoogle || []).push({});
(adsbygoogle = window.adsbygoogle || []).push({});

/* PLAYER */

const player =
document.getElementById('player');

const world =
document.getElementById('world');

const enemies =
document.querySelectorAll('.enemy');

let x = 2400;
let y = 2400;

let speed = 6;

let keys = {};

let xp = 0;
let level = 1;
let coins = 0;
let hp = 100;

let damage = 15;

let doubleXP = false;

/* LOAD SAVE */

function loadGame(){

const save =
JSON.parse(
localStorage.getItem('schoolMMO')
);

if(save){

x = save.x;
y = save.y;
xp = save.xp;
level = save.level;
coins = save.coins;
hp = save.hp;

updateHud();

}

}

loadGame();

/* SAVE */

setInterval(()=>{

localStorage.setItem(
'schoolMMO',

JSON.stringify({

x,
y,
xp,
level,
coins,
hp

})

);

},3000);

/* HUD */

function updateHud(){

document.getElementById(
'xp'
).innerText = xp;

document.getElementById(
'level'
).innerText = level;

document.getElementById(
'coins'
).innerText = coins;

document.getElementById(
'hp'
).innerText = hp;

document.getElementById(
'tabXP'
).innerText = xp;

document.getElementById(
'tabLevel'
).innerText = level;

document.getElementById(
'tabCoins'
).innerText = coins;

}

/* MOVEMENT */

window.addEventListener(
'keydown',

e=>{

keys[e.key.toLowerCase()] = true;

/* TAB */

if(e.key === 'Tab'){

e.preventDefault();

document.getElementById(
'tabMenu'
).style.display = 'flex';

}

/* INVENTORY */

if(e.key.toLowerCase() === 'e'){

const inv =
document.getElementById(
'inventory'
);

if(inv.style.display === 'block'){

inv.style.display = 'none';

}else{

inv.style.display = 'block';

}

}

/* ATTACK */

if(e.key === ' '){

attack();

}

/* HOTBAR */

if(['1','2','3','4','5']
.includes(e.key)){

selectSlot(e.key);

}

});

window.addEventListener(
'keyup',

e=>{

keys[e.key.toLowerCase()] = false;

if(e.key === 'Tab'){

document.getElementById(
'tabMenu'
).style.display = 'none';

}

});

/* HOTBAR */

function selectSlot(num){

document.querySelectorAll('.slot')
.forEach(slot=>{

slot.classList.remove('active');

if(slot.dataset.slot === num){

slot.classList.add('active');

}

});

}

/* ATTACK */

function attack(){

const damageText =
document.getElementById(
'damageText'
);

enemies.forEach(enemy=>{

if(enemy.style.display === 'none')
return;

let ex =
parseInt(enemy.style.left);

let ey =
parseInt(enemy.style.top);

let dist =
Math.hypot(ex - x, ey - y);

if(dist < 140){

damageText.innerText =
'-' + damage;

setTimeout(()=>{

damageText.innerText = '';

},400);

enemy.style.display = 'none';

coins += 25;

xp += doubleXP ? 40 : 20;

if(xp >= 100){

level++;

xp = 0;

damage += 5;

hp += 20;

}

updateHud();

}

});

}

/* QUEST */

const teacher =
document.getElementById(
'teacher'
);

let questDone = false;

setInterval(()=>{

if(questDone)
return;

let tx =
parseInt(teacher.style.left);

let ty =
parseInt(teacher.style.top);

let dist =
Math.hypot(tx - x, ty - y);

if(dist < 120){

questDone = true;

xp += 50;

coins += 100;

updateHud();

document.getElementById(
'quest'
).innerText =

'Quest Complete! +50 XP +100 Coins';

}

},1000);

/* BLACKSMITH */

const blacksmith =
document.getElementById(
'blacksmith'
);

setInterval(()=>{

let bx =
parseInt(blacksmith.style.left);

let by =
parseInt(blacksmith.style.top);

let dist =
Math.hypot(bx - x, by - y);

if(dist < 120 && coins >= 100){

coins -= 100;

damage += 5;

updateHud();

}

},1000);

/* AD REWARD */

document.getElementById(
'rewardBtn'
).onclick = ()=>{

doubleXP = true;

document.getElementById(
'rewardBtn'
).innerText =

'Double XP Active!';

setTimeout(()=>{

doubleXP = false;

document.getElementById(
'rewardBtn'
).innerText =

'▶ Watch Ad → Double XP';

},300000);

};

/* GAME LOOP */

function gameLoop(){

if(keys['w']) y -= speed;
if(keys['s']) y += speed;
if(keys['a']) x -= speed;
if(keys['d']) x += speed;

player.style.left = x + 'px';
player.style.top = y + 'px';

const camX =
window.innerWidth / 2 - x - 32;

const camY =
window.innerHeight / 2 - y - 32;

world.style.transform =
`translate(${camX}px, ${camY}px)`;

requestAnimationFrame(gameLoop);

}

updateHud();

gameLoop();

</script>
