<!DOCTYPE html>
<html lang="en">
<head>

<!-- ADSENSE -->
<script async
src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613"
crossorigin="anonymous"></script>

<meta charset="UTF-8">

<title>School Essentials</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:white;
}

header{
background:#0f172a;
padding:18px;
text-align:center;
border-bottom:2px solid #1e293b;
}

.logo{
font-size:2rem;
font-weight:bold;
color:#f97316;
}

.search{
display:block;
margin:20px auto;
width:90%;
max-width:600px;
padding:14px;
border-radius:12px;
border:none;
background:#0f172a;
color:white;
border:1px solid #334155;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
max-width:1400px;
margin:auto;
}

.card{
background:#0f172a;
border:1px solid #334155;
border-radius:18px;
overflow:hidden;
}

.thumb{
height:160px;
background:#1e293b;
display:flex;
justify-content:center;
align-items:center;
font-size:60px;
}

.content{
padding:16px;
}

.content h3{
margin-bottom:10px;
color:#f97316;
}

.btn{
width:100%;
padding:12px;
background:#f97316;
border:none;
color:white;
font-weight:bold;
border-radius:10px;
cursor:pointer;
}

.btn:hover{
background:#ea580c;
}

#adTop{
max-width:1200px;
margin:20px auto;
padding:10px;
}

#player{
display:none;
position:fixed;
inset:0;
background:black;
z-index:9999;
flex-direction:column;
}

#topBar{
background:#0f172a;
padding:10px;
display:flex;
justify-content:space-between;
}

iframe{
flex:1;
border:none;
width:100%;
}

</style>
</head>
<body>

<header>
<div class="logo">🎮 School Essentials</div>
</header>

<div id="adTop">

<ins class="adsbygoogle"
style="display:block"
data-ad-client="ca-pub-4335653991954613"
data-ad-slot="1234567890"
data-ad-format="auto"
data-full-width-responsive="true"></ins>

</div>

<input
id="search"
class="search"
placeholder="Search games..."
onkeyup="searchGames()">

<div class="grid" id="games">

<!-- GAME 1 -->

<!-- GAME 5 -->

</div>
</div>

<!-- GAME 7 -->

<div class="content">
<h3>Pacman</h3>
<button class="btn"
onclick="openGame('https://freepacman.org/')">
Play
</button>
</div>
</div>

<!-- GAME 8 -->
<div class="card game">

</div>
</div>

</div>

<div id="player">

<div id="topBar">

<button class="btn"
style="width:auto"
onclick="closeGame()">
Close
</button>

<button class="btn"
style="width:auto"
onclick="fullscreenGame()">
Fullscreen
</button>

</div>

<iframe
id="frame"
allowfullscreen>
</iframe>

</div>

<script>

(adsbygoogle = window.adsbygoogle || []).push({});

function openGame(url){

document.getElementById('player').style.display='flex';
document.getElementById('frame').src=url;

}

function closeGame(){

document.getElementById('player').style.display='none';
document.getElementById('frame').src='';

}

function fullscreenGame(){

let frame=document.getElementById('frame');

if(frame.requestFullscreen){
frame.requestFullscreen();
}

}

function searchGames(){

let input=
document.getElementById('search')
.value.toLowerCase();

let games=
document.querySelectorAll('.game');

games.forEach(game=>{

let text=
game.innerText.toLowerCase();

game.style.display=
text.includes(input)
? ''
: 'none';

});

}

</script>

</body>
