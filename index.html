<!DOCTYPE html>
<html lang="en">
<head>

  <!-- GOOGLE ADSENSE -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613"
    crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>School Essentials MMO</title>

  <meta name="google-adsense-account"
        content="ca-pub-4335653991954613">

  <link rel="icon"
        type="image/png"
        href="favicon.png">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0b1120;
      overflow:hidden;
      color:white;
    }

    /* SIDE ADS */

    .side-ad{
      position:fixed;
      top:0;
      width:160px;
      height:100vh;

      background:#111827;

      border-left:1px solid #1e293b;
      border-right:1px solid #1e293b;

      z-index:5;
    }

    .left-ad{
      left:0;
    }

    .right-ad{
      right:0;
    }

    @media(max-width:1200px){

      .side-ad{
        display:none;
      }

    }

    /* GAME */

    #gameContainer{
      position:relative;

      width:calc(100vw - 320px);
      height:100vh;

      margin:auto;
    }

    @media(max-width:1200px){

      #gameContainer{
        width:100vw;
      }

    }

    canvas{
      display:block;
      background:#2d5a27;
      image-rendering:pixelated;
    }

    /* HUD */

    #hud{
      position:absolute;
      top:15px;
      left:15px;

      display:flex;
      gap:12px;

      z-index:10;
    }

    .hud-box{
      background:rgba(15,23,42,0.9);

      border:1px solid #1e293b;

      padding:10px 14px;

      border-radius:12px;

      font-weight:bold;
    }

    /* HOTBAR */

    #hotbar{
      position:absolute;

      bottom:20px;
      left:50%;

      transform:translateX(-50%);

      display:flex;
      gap:8px;

      z-index:10;
    }

    .slot{
      width:60px;
      height:60px;

      background:#111827;

      border:2px solid #374151;

      border-radius:12px;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:1.3rem;
    }

    /* INVENTORY */

    #inventory{
      position:absolute;

      top:50%;
      left:50%;

      transform:translate(-50%,-50%);

      width:520px;

      background:#0f172a;

      border:2px solid #334155;

      border-radius:20px;

      padding:20px;

      display:none;

      z-index:20;
    }

    #inventory h2{
      margin-bottom:20px;
      color:#f97316;
    }

    .inventory-grid{
      display:grid;

      grid-template-columns:
      repeat(5,1fr);

      gap:10px;
    }

    .inventory-slot{
      width:85px;
      height:85px;

      background:#1e293b;

      border:2px solid #475569;

      border-radius:12px;
    }

    /* TAB MENU */

    #tabMenu{
      position:absolute;
      inset:0;

      background:rgba(0,0,0,0.8);

      display:none;

      z-index:30;

      align-items:center;
      justify-content:center;
    }

    #tabContent{
      background:#0f172a;

      padding:40px;

      border-radius:20px;

      width:500px;

      text-align:center;

      border:2px solid #334155;
    }

    #tabContent h1{
      color:#f97316;
      margin-bottom:25px;
    }

    .stat{
      margin-bottom:15px;
      font-size:1.2rem;
    }

    /* QUEST */

    #questBox{
      position:absolute;

      top:15px;
      right:15px;

      width:280px;

      background:rgba(15,23,42,0.9);

      border:1px solid #1e293b;

      border-radius:16px;

      padding:15px;

      z-index:10;
    }

    #questBox h3{
      color:#f97316;
      margin-bottom:10px;
    }

    /* REWARDED ADS */

    #rewardUI{
      position:absolute;

      right:15px;
      bottom:120px;

      z-index:10;
    }

    #rewardBtn{
      background:#f97316;
      color:white;

      border:none;

      padding:12px 18px;

      border-radius:12px;

      font-weight:bold;

      cursor:pointer;
    }

    #rewardBtn:hover{
      background:#ea580c;
    }

    #boostTimer{
      margin-top:10px;

      background:#0f172a;

      border:1px solid #1e293b;

      padding:10px;

      border-radius:12px;

      text-align:center;
    }

  </style>

</head>

<body>

  <!-- LEFT AD -->

  <div class="side-ad left-ad">

    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-4335653991954613"
      data-ad-slot="1111111111"
      data-ad-format="vertical"></ins>

  </div>

  <!-- RIGHT AD -->

  <div class="side-ad right-ad">

    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-4335653991954613"
      data-ad-slot="2222222222"
      data-ad-format="vertical"></ins>

  </div>

  <!-- GAME -->

  <div id="gameContainer">

    <canvas id="game"></canvas>

    <!-- HUD -->

    <div id="hud">

      <div class="hud-box">
        ❤️ <span id="hp">100</span>
      </div>

      <div class="hud-box">
        🪙 <span id="coins">50</span>
      </div>

      <div class="hud-box">
        ⭐ LVL <span id="level">1</span>
      </div>

      <div class="hud-box">
        XP <span id="xp">0</span>/100
      </div>

    </div>

    <!-- QUEST -->

    <div id="questBox">

      <h3>📜 Quest</h3>

      <p>
        Talk to the teacher in the classroom.
      </p>

    </div>

    <!-- HOTBAR -->

    <div id="hotbar">

      <div class="slot">⚔️</div>
      <div class="slot">🪓</div>
      <div class="slot">🧪</div>
      <div class="slot">🍎</div>
      <div class="slot">📘</div>

    </div>

    <!-- REWARDED ADS -->

    <div id="rewardUI">

      <button id="rewardBtn"
      onclick="watchRewardAd()">

        ▶ 2x XP For 5 Minutes

      </button>

      <div id="boostTimer">

        XP Boost Inactive

      </div>

    </div>

    <!-- INVENTORY -->

    <div id="inventory">

      <h2>🎒 Inventory</h2>

      <div class="inventory-grid">

        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>

        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>

      </div>

    </div>

    <!-- TAB MENU -->

    <div id="tabMenu">

      <div id="tabContent">

        <h1>School Essentials</h1>

        <div class="stat">
          Level: 1
        </div>

        <div class="stat">
          XP: 0 / 100
        </div>

        <div class="stat">
          Coins: 50
        </div>

      </div>

    </div>

  </div>

  <script>

    // CANVAS

    const canvas =
    document.getElementById("game");

    const ctx =
    canvas.getContext("2d");

    resizeCanvas();

    window.addEventListener(
      "resize",
      resizeCanvas
    );

    function resizeCanvas(){

      canvas.width =
      document.getElementById(
      "gameContainer"
      ).offsetWidth;

      canvas.height =
      window.innerHeight;

    }

    // PLAYER

    const player = {

      x:500,
      y:300,

      size:32,

      speed:4,

      color:"#f97316"

    };

    // MAP OBJECTS

    const walls = [

      {x:150,y:120,w:200,h:40},
      {x:500,y:400,w:250,h:40},
      {x:800,y:180,w:40,h:250},

      // SCHOOL

      {x:300,y:250,w:300,h:180}

    ];

    // INPUT

    const keys = {};

    document.addEventListener(
      "keydown",
      e => {

        keys[e.key.toLowerCase()] = true;

        // INVENTORY

        if(e.key === "e"){

          toggleInventory();

        }

        // TAB MENU

        if(e.key === "Tab"){

          e.preventDefault();

          document.getElementById(
          "tabMenu"
          ).style.display = "flex";

        }

      }
    );

    document.addEventListener(
      "keyup",
      e => {

        keys[e.key.toLowerCase()] = false;

        if(e.key === "Tab"){

          document.getElementById(
          "tabMenu"
          ).style.display = "none";

        }

      }
    );

    // INVENTORY

    function toggleInventory(){

      const inv =
      document.getElementById(
      "inventory"
      );

      inv.style.display =
      inv.style.display === "block"
      ? "none"
      : "block";

    }

    // GAME LOOP

    function gameLoop(){

      update();

      draw();

      requestAnimationFrame(
      gameLoop
      );

    }

    gameLoop();

    // UPDATE

    function update(){

      if(keys["w"]){

        player.y -= player.speed;

      }

      if(keys["s"]){

        player.y += player.speed;

      }

      if(keys["a"]){

        player.x -= player.speed;

      }

      if(keys["d"]){

        player.x += player.speed;

      }

    }

    // DRAW

    function draw(){

      // GRASS

      ctx.fillStyle = "#2d5a27";

      ctx.fillRect(
      0,0,
      canvas.width,
      canvas.height
      );

      // GRID

      ctx.strokeStyle =
      "rgba(255,255,255,0.03)";

      for(let x = 0;
      x < canvas.width;
      x += 64){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
        x,
        canvas.height
        );

        ctx.stroke();

      }

      for(let y = 0;
      y < canvas.height;
      y += 64){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
        canvas.width,
        y
        );

        ctx.stroke();

      }

      // WALLS

      walls.forEach(w => {

        ctx.fillStyle = "#475569";

        ctx.fillRect(
        w.x,w.y,
        w.w,w.h
        );

      });

      // PLAYER SHADOW

      ctx.fillStyle =
      "rgba(0,0,0,0.3)";

      ctx.beginPath();

      ctx.ellipse(
      player.x + 16,
      player.y + 30,
      16,
      8,
      0,
      0,
      Math.PI * 2
      );

      ctx.fill();

      // PLAYER

      ctx.fillStyle =
      player.color;

      ctx.fillRect(
      player.x,
      player.y,
      player.size,
      player.size
      );

      // EYES

      ctx.fillStyle = "white";

      ctx.fillRect(
      player.x + 7,
      player.y + 8,
      4,
      4
      );

      ctx.fillRect(
      player.x + 20,
      player.y + 8,
      4,
      4
      );

    }

    // SAVE SYSTEM

    setInterval(() => {

      localStorage.setItem(
      "schoolPlayer",
      JSON.stringify(player)
      );

    },3000);

    const save =
    localStorage.getItem(
    "schoolPlayer"
    );

    if(save){

      Object.assign(
      player,
      JSON.parse(save)
      );

    }

    // REWARDED ADS

    let boostSeconds = 0;

    function watchRewardAd(){

      if(boostSeconds > 0){

        return;

      }

      rewardBtn.innerText =
      "Loading Ad...";

      setTimeout(() => {

        boostSeconds = 300;

        rewardBtn.innerText =
        "2x XP Active";

      },3000);

    }

    setInterval(() => {

      if(boostSeconds > 0){

        boostSeconds--;

        let mins =
        Math.floor(
        boostSeconds / 60
        );

        let secs =
        boostSeconds % 60;

        if(secs < 10){

          secs = "0" + secs;

        }

        document.getElementById(
        "boostTimer"
        ).innerText =

        "2x XP: " +
        mins + ":" + secs;

      }

      else{

        document.getElementById(
        "boostTimer"
        ).innerText =

        "XP Boost Inactive";

        rewardBtn.innerText =
        "▶ 2x XP For 5 Minutes";

      }

    },1000);

  </script>

</body>
</html>
