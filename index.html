<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Essentials</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- ADSENSE -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613"
    crossorigin="anonymous"></script>

  <meta name="google-adsense-account"
  content="ca-pub-4335653991954613">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#020617;
      overflow:hidden;
      color:white;
    }

    canvas{
      display:block;
      background:#111827;
    }

    .hud{
      position:fixed;
      top:15px;
      left:15px;

      background:rgba(15,23,42,0.9);

      border:2px solid #1e293b;

      border-radius:16px;

      padding:15px;

      width:280px;

      z-index:100;
    }

    .hud h1{
      color:#f97316;
      font-size:1.5rem;
      margin-bottom:10px;
    }

    .stat{
      margin-bottom:8px;
      color:#cbd5e1;
    }

    .quest{
      margin-top:15px;
      padding-top:12px;
      border-top:1px solid #334155;
    }

    .controls{
      position:fixed;
      bottom:15px;
      left:15px;

      background:rgba(15,23,42,0.9);

      border:2px solid #1e293b;

      border-radius:16px;

      padding:12px;

      z-index:100;

      color:#cbd5e1;
    }

    .school-title{
      position:fixed;
      top:15px;
      right:15px;

      background:rgba(15,23,42,0.9);

      border:2px solid #1e293b;

      border-radius:16px;

      padding:12px 18px;

      color:#f97316;

      font-weight:bold;

      z-index:100;
    }

  </style>

</head>

<body>

  <!-- HUD -->

  <div class="hud">

    <h1>🎒 School Essentials</h1>

    <div class="stat">
      Level: <span id="level">1</span>
    </div>

    <div class="stat">
      XP: <span id="xp">0</span>
    </div>

    <div class="stat">
      Coins: <span id="coins">0</span>
    </div>

    <div class="stat">
      Energy: <span id="energy">100</span>
    </div>

    <div class="quest">

      <strong style="color:#f97316;">
        Current Quest
      </strong>

      <p id="questText">
        Talk to the teacher in Math Class.
      </p>

    </div>

  </div>

  <!-- CONTROLS -->

  <div class="controls">

    WASD = Move<br>
    E = Interact<br>
    SHIFT = Sprint

  </div>

  <!-- TITLE -->

  <div class="school-title">

    🏫 School Essentials

  </div>

  <!-- GAME -->

  <canvas id="game"></canvas>

  <script>

    // CANVAS

    const canvas =
    document.getElementById("game");

    const ctx =
    canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // PLAYER

    const player = {

      x:200,
      y:200,

      size:35,

      speed:4,

      color:"#f97316"

    };

    // GAME DATA

    let level = 1;
    let xp = 0;
    let coins = 0;
    let energy = 100;

    // KEYS

    const keys = {};

    document.addEventListener(
      "keydown",
      (e)=>{

        keys[e.key.toLowerCase()] = true;

      }
    );

    document.addEventListener(
      "keyup",
      (e)=>{

        keys[e.key.toLowerCase()] = false;

      }
    );

    // NPCS

    const npcs = [

      {
        x:600,
        y:200,
        color:"#38bdf8",
        text:"Teacher: Complete Math Quiz!"
      },

      {
        x:850,
        y:500,
        color:"#22c55e",
        text:"Student: Want snacks from the cafeteria?"
      },

      {
        x:350,
        y:700,
        color:"#e879f9",
        text:"Principal: Don't skip class!"
      }

    ];

    // BUILDINGS

    const rooms = [

      {
        x:100,
        y:100,
        w:350,
        h:250,
        color:"#1e293b",
        label:"Math Class"
      },

      {
        x:550,
        y:100,
        w:350,
        h:250,
        color:"#1e293b",
        label:"Science Lab"
      },

      {
        x:100,
        y:450,
        w:350,
        h:250,
        color:"#1e293b",
        label:"Cafeteria"
      },

      {
        x:550,
        y:450,
        w:350,
        h:250,
        color:"#1e293b",
        label:"Gym"
      }

    ];

    // UPDATE

    function update(){

      let moveSpeed =
      keys["shift"] ? 7 : 4;

      if(keys["w"]){

        player.y -= moveSpeed;

      }

      if(keys["s"]){

        player.y += moveSpeed;

      }

      if(keys["a"]){

        player.x -= moveSpeed;

      }

      if(keys["d"]){

        player.x += moveSpeed;

      }

      // INTERACT

      if(keys["e"]){

        npcs.forEach(npc=>{

          const dx =
          player.x - npc.x;

          const dy =
          player.y - npc.y;

          const distance =
          Math.sqrt(dx*dx + dy*dy);

          if(distance < 70){

            alert(npc.text);

            xp += 10;
            coins += 5;

            if(xp >= 100){

              xp = 0;
              level++;

            }

            updateHud();

          }

        });

      }

    }

    // DRAW

    function draw(){

      // BACKGROUND

      ctx.fillStyle = "#020617";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      // FLOOR GRID

      for(let x=0;x<canvas.width;x+=60){

        for(let y=0;y<canvas.height;y+=60){

          ctx.strokeStyle =
          "#0f172a";

          ctx.strokeRect(
            x,
            y,
            60,
            60
          );

        }

      }

      // ROOMS

      rooms.forEach(room=>{

        ctx.fillStyle =
        room.color;

        ctx.fillRect(
          room.x,
          room.y,
          room.w,
          room.h
        );

        ctx.strokeStyle =
        "#f97316";

        ctx.lineWidth = 3;

        ctx.strokeRect(
          room.x,
          room.y,
          room.w,
          room.h
        );

        ctx.fillStyle =
        "white";

        ctx.font =
        "24px Arial";

        ctx.fillText(
          room.label,
          room.x + 20,
          room.y + 40
        );

      });

      // NPCS

      npcs.forEach(npc=>{

        ctx.fillStyle =
        npc.color;

        ctx.fillRect(
          npc.x,
          npc.y,
          35,
          35
        );

      });

      // PLAYER

      ctx.fillStyle =
      player.color;

      ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
      );

      // PLAYER LABEL

      ctx.fillStyle =
      "white";

      ctx.font =
      "18px Arial";

      ctx.fillText(
        "YOU",
        player.x - 5,
        player.y - 10
      );

    }

    // HUD

    function updateHud(){

      document.getElementById(
      "level").innerText = level;

      document.getElementById(
      "xp").innerText = xp;

      document.getElementById(
      "coins").innerText = coins;

      document.getElementById(
      "energy").innerText = energy;

    }

    // LOOP

    function gameLoop(){

      update();
      draw();

      requestAnimationFrame(
        gameLoop
      );

    }

    gameLoop();

    // RESIZE

    window.addEventListener(
      "resize",
      ()=>{

        canvas.width =
        window.innerWidth;

        canvas.height =
        window.innerHeight;

      }
    );

  </script>

</body>
</html>
