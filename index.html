<!DOCTYPE html>
<html lang="en">
<head>

  <!-- GOOGLE ADSENSE -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613"
    crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Essentials MMORPG</title>

  <meta name="google-adsense-account"
        content="ca-pub-4335653991954613">

  <link rel="icon" type="image/png" href="favicon.png">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      overflow:hidden;
      background:#020617;
      color:white;
    }

    canvas{
      display:block;
      background:#0f172a;
    }

    /* TOP UI */

    .top-ui{
      position:fixed;
      top:15px;
      left:15px;
      z-index:100;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .ui-box{
      background:#111827;
      border:2px solid #334155;
      border-radius:14px;
      padding:10px;
      width:260px;
    }

    .bar{
      width:100%;
      height:22px;
      background:#1e293b;
      border-radius:10px;
      overflow:hidden;
      margin-top:6px;
    }

    .fill{
      height:100%;
      transition:0.2s;
    }

    .health{
      background:#ef4444;
      width:100%;
    }

    .xp{
      background:#3b82f6;
      width:0%;
    }

    .coins{
      color:#facc15;
      font-weight:bold;
    }

    /* HOTBAR */

    .hotbar{
      position:fixed;
      bottom:15px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:10px;
      z-index:100;
    }

    .slot{
      width:72px;
      height:72px;

      background:#111827;

      border:3px solid #334155;

      border-radius:14px;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:2rem;

      position:relative;
    }

    .slot-num{
      position:absolute;
      top:4px;
      left:6px;
      font-size:0.7rem;
      color:#94a3b8;
    }

    /* TAB MENU */

    .tab-screen{
      position:fixed;
      inset:0;

      background:rgba(0,0,0,0.85);

      z-index:200;

      display:none;
      align-items:center;
      justify-content:center;
    }

    .tab-container{
      width:90%;
      max-width:1100px;

      background:#0f172a;

      border:3px solid #334155;

      border-radius:24px;

      padding:30px;
    }

    .tab-title{
      font-size:2rem;
      color:#f97316;
      margin-bottom:20px;
    }

    .tab-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .tab-box{
      background:#111827;
      border:2px solid #334155;
      border-radius:18px;
      padding:20px;
    }

    .inventory-grid{
      display:grid;
      grid-template-columns:repeat(9,1fr);
      gap:10px;
      margin-top:15px;
    }

    .inventory-slot{
      aspect-ratio:1/1;

      background:#1e293b;

      border:2px solid #334155;

      border-radius:10px;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:2rem;
    }

    /* QUEST */

    .quest-box{
      position:fixed;
      top:220px;
      left:15px;

      width:260px;

      background:#111827;

      border:2px solid #334155;

      border-radius:16px;

      padding:15px;

      z-index:100;
    }

    .quest-box h3{
      color:#f97316;
      margin-bottom:10px;
    }

    /* DIALOG */

    .dialogue{
      position:fixed;

      bottom:120px;
      left:50%;

      transform:translateX(-50%);

      width:700px;
      max-width:90%;

      background:#111827;

      border:3px solid #334155;

      border-radius:18px;

      padding:20px;

      z-index:300;

      display:none;
    }

    .dialog-name{
      color:#f97316;
      font-size:1.2rem;
      font-weight:bold;
      margin-bottom:10px;
    }

    .dialog-text{
      color:#e2e8f0;
      line-height:1.5;
    }

    /* MINIMAP */

    .minimap{
      position:fixed;
      top:15px;
      right:15px;

      width:220px;
      height:220px;

      background:#111827;

      border:3px solid #334155;

      border-radius:18px;

      overflow:hidden;

      z-index:100;
    }

    .minimap-title{
      text-align:center;
      background:#0f172a;
      padding:8px;
      color:#f97316;
      font-weight:bold;
    }

    /* ADS */

    .ad-left,
    .ad-right{
      position:fixed;
      top:120px;
      width:160px;
      height:600px;
      z-index:50;

      background:#111827;

      border:2px solid #334155;

      border-radius:16px;

      overflow:hidden;
    }

    .ad-left{
      left:10px;
    }

    .ad-right{
      right:10px;
    }

    @media(max-width:1200px){

      .ad-left,
      .ad-right{
        display:none;
      }

    }

  </style>

</head>

<body>

  <!-- ADS -->

  <div class="ad-left">

    <ins class="adsbygoogle"
      style="display:block;width:160px;height:600px"
      data-ad-client="ca-pub-4335653991954613"
      data-ad-slot="1234567890"></ins>

  </div>

  <div class="ad-right">

    <ins class="adsbygoogle"
      style="display:block;width:160px;height:600px"
      data-ad-client="ca-pub-4335653991954613"
      data-ad-slot="1234567890"></ins>

  </div>

  <!-- UI -->

  <div class="top-ui">

    <div class="ui-box">

      ❤️ Health

      <div class="bar">
        <div class="fill health"
        id="healthFill"></div>
      </div>

    </div>

    <div class="ui-box">

      ⭐ XP

      <div class="bar">
        <div class="fill xp"
        id="xpFill"></div>
      </div>

    </div>

    <div class="ui-box coins"
    id="coinsText">

      🪙 Coins: 0

    </div>

  </div>

  <!-- QUEST -->

  <div class="quest-box">

    <h3>📜 Main Quest</h3>

    <p id="questText">
      Defeat 5 corrupted slimes near the school.
    </p>

  </div>

  <!-- MINIMAP -->

  <div class="minimap">

    <div class="minimap-title">
      🗺 Campus Map
    </div>

    <canvas id="miniMap"
    width="220"
    height="180"></canvas>

  </div>

  <!-- HOTBAR -->

  <div class="hotbar">

    <div class="slot">
      <div class="slot-num">1</div>
      ⚔️
    </div>

    <div class="slot">
      <div class="slot-num">2</div>
      🛡️
    </div>

    <div class="slot">
      <div class="slot-num">3</div>
      🧪
    </div>

    <div class="slot">
      <div class="slot-num">4</div>
      🏹
    </div>

    <div class="slot">
      <div class="slot-num">5</div>
      💎
    </div>

  </div>

  <!-- TAB -->

  <div class="tab-screen"
  id="tabMenu">

    <div class="tab-container">

      <div class="tab-title">
        🎮 School Essentials MMORPG
      </div>

      <div class="tab-grid">

        <div class="tab-box">

          <h2>Player Stats</h2>

          <br>

          <p>
            Level:
            <span id="levelText">1</span>
          </p>

          <br>

          <p>
            XP:
            <span id="xpText">0</span>/100
          </p>

          <br>

          <p>
            Weapon Level:
            <span id="weaponText">1</span>
          </p>

        </div>

        <div class="tab-box">

          <h2>Inventory</h2>

          <div class="inventory-grid">

            <div class="inventory-slot">⚔️</div>
            <div class="inventory-slot">🛡️</div>
            <div class="inventory-slot">🧪</div>
            <div class="inventory-slot">🏹</div>
            <div class="inventory-slot">💎</div>

            <div class="inventory-slot"></div>
            <div class="inventory-slot"></div>
            <div class="inventory-slot"></div>
            <div class="inventory-slot"></div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- DIALOG -->

  <div class="dialogue"
  id="dialogueBox">

    <div class="dialog-name"
    id="dialogueName">

      NPC

    </div>

    <div class="dialog-text"
    id="dialogueText">

      Hello there.

    </div>

  </div>

  <!-- GAME -->

  <canvas id="game"></canvas>

  <script>

    const canvas =
    document.getElementById("game");

    const ctx =
    canvas.getContext("2d");

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

    const miniMap =
    document.getElementById(
    "miniMap"
    );

    const miniCtx =
    miniMap.getContext("2d");

    const mapWidth = 3200;
    const mapHeight = 3200;

    const player = {

      x:1600,
      y:1600,

      size:30,

      speed:5,

      health:100,
      maxHealth:100,

      xp:0,

      level:1,

      coins:0,

      weapon:1

    };

    const camera = {
      x:0,
      y:0
    };

    const keys = {};

    let kills = 0;

    /* NPCS */

    const npcs = [

      {
        x:1600,
        y:1450,

        name:"Principal Oak",

        color:"#60a5fa",

        dialogue:
        "The school has been invaded by corrupted slimes. Save the campus."
      },

      {
        x:1050,
        y:950,

        name:"Blacksmith Ron",

        color:"#f97316",

        dialogue:
        "Press F near me to upgrade your weapon for 50 coins."
      },

      {
        x:2400,
        y:1800,

        name:"Librarian Luna",

        color:"#a855f7",

        dialogue:
        "Legends say a hidden boss lives near the football field."
      }

    ];

    /* ENEMIES */

    const enemies = [];

    for(let i=0;i<25;i++){

      enemies.push({

        x:Math.random()*mapWidth,
        y:Math.random()*mapHeight,

        size:25,

        health:40,

        alive:true

      });

    }

    /* LOOT */

    const coins = [];

    for(let i=0;i<40;i++){

      coins.push({

        x:Math.random()*mapWidth,
        y:Math.random()*mapHeight,

        taken:false

      });

    }

    function update(){

      if(keys["w"]) player.y -= player.speed;
      if(keys["s"]) player.y += player.speed;
      if(keys["a"]) player.x -= player.speed;
      if(keys["d"]) player.x += player.speed;

      player.x =
      Math.max(
      0,
      Math.min(mapWidth,player.x)
      );

      player.y =
      Math.max(
      0,
      Math.min(mapHeight,player.y)
      );

      camera.x =
      player.x-canvas.width/2;

      camera.y =
      player.y-canvas.height/2;

      /* ATTACK */

      if(keys[" "]){

        enemies.forEach(enemy=>{

          if(enemy.alive){

            const dx =
            enemy.x-player.x;

            const dy =
            enemy.y-player.y;

            const dist =
            Math.sqrt(dx*dx+dy*dy);

            if(dist < 90){

              enemy.health -=
              0.5 * player.weapon;

              if(enemy.health <= 0){

                enemy.alive = false;

                kills++;

                player.coins += 20;

                player.xp += 25;

                if(player.xp >= 100){

                  player.level++;

                  player.xp = 0;

                }

              }

            }

          }

        });

      }

      /* COINS */

      coins.forEach(c=>{

        if(!c.taken){

          const dx =
          c.x-player.x;

          const dy =
          c.y-player.y;

          const dist =
          Math.sqrt(dx*dx+dy*dy);

          if(dist < 40){

            c.taken = true;

            player.coins += 5;

          }

        }

      });

      /* UI */

      document.getElementById(
      "healthFill"
      ).style.width =
      (player.health/player.maxHealth*100)
      +"%";

      document.getElementById(
      "xpFill"
      ).style.width =
      player.x+"%";

      document.getElementById(
      "coinsText"
      ).innerText =
      "🪙 Coins: "+player.coins;

      document.getElementById(
      "levelText"
      ).innerText =
      player.level;

      document.getElementById(
      "xpText"
      ).innerText =
      player.xp;

      document.getElementById(
      "weaponText"
      ).innerText =
      player.weapon;

      if(kills >= 5){

        document.getElementById(
        "questText"
        ).innerText =
        "Quest Complete! Explore the campus.";

      }

      /* SAVE */

      localStorage.setItem(
      "schoolMMOsave",
      JSON.stringify(player)
      );

    }

    const save =
    localStorage.getItem(
    "schoolMMOsave"
    );

    if(save){

      Object.assign(
      player,
      JSON.parse(save)
      );

    }

    function drawMap(){

      for(let x=0;x<mapWidth;x+=100){

        for(let y=0;y<mapHeight;y+=100){

          ctx.fillStyle =
          (x+y)%200===0
          ? "#1e293b"
          : "#0f172a";

          ctx.fillRect(
            x-camera.x,
            y-camera.y,
            100,
            100
          );

        }

      }

      /* SCHOOL */

      ctx.fillStyle = "#475569";

      ctx.fillRect(
        1400-camera.x,
        1300-camera.y,
        500,
        350
      );

      ctx.fillStyle = "white";

      ctx.font = "38px Arial";

      ctx.fillText(
        "SCHOOL",
        1540-camera.x,
        1490-camera.y
      );

      /* LIBRARY */

      ctx.fillStyle = "#312e81";

      ctx.fillRect(
        2300-camera.x,
        800-camera.y,
        350,
        250
      );

      ctx.fillStyle = "white";

      ctx.fillText(
        "LIBRARY",
        2390-camera.x,
        940-camera.y
      );

      /* BLACKSMITH */

      ctx.fillStyle = "#7c2d12";

      ctx.fillRect(
        900-camera.x,
        800-camera.y,
        250,
        220
      );

      ctx.fillStyle = "white";

      ctx.fillText(
        "BLACKSMITH",
        920-camera.x,
        930-camera.y
      );

      /* FOOTBALL FIELD */

      ctx.fillStyle = "#14532d";

      ctx.fillRect(
        600-camera.x,
        2200-camera.y,
        700,
        400
      );

      ctx.fillStyle = "white";

      ctx.fillText(
        "FOOTBALL FIELD",
        760-camera.x,
        2420-camera.y
      );

    }

    function drawPlayer(){

      ctx.fillStyle = "#f97316";

      ctx.beginPath();

      ctx.arc(
        player.x-camera.x,
        player.y-camera.y,
        player.size,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.fillStyle = "white";

      ctx.fillText(
        "Lv."+player.level,
        player.x-camera.x-20,
        player.y-camera.y-40
      );

    }

    function drawEnemies(){

      enemies.forEach(enemy=>{

        if(enemy.alive){

          ctx.fillStyle = "#22c55e";

          ctx.beginPath();

          ctx.arc(
            enemy.x-camera.x,
            enemy.y-camera.y,
            enemy.size,
            0,
            Math.PI*2
          );

          ctx.fill();

          ctx.fillStyle = "white";

          ctx.fillText(
            "Slime",
            enemy.x-camera.x-20,
            enemy.y-camera.y-35
          );

        }

      });

    }

    function drawNPCs(){

      npcs.forEach(npc=>{

        ctx.fillStyle = npc.color;

        ctx.beginPath();

        ctx.arc(
          npc.x-camera.x,
          npc.y-camera.y,
          28,
          0,
          Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle = "white";

        ctx.fillText(
          npc.name,
          npc.x-camera.x-40,
          npc.y-camera.y-38
        );

      });

    }

    function drawCoins(){

      coins.forEach(c=>{

        if(!c.taken){

          ctx.fillStyle = "#facc15";

          ctx.beginPath();

          ctx.arc(
            c.x-camera.x,
            c.y-camera.y,
            10,
            0,
            Math.PI*2
          );

          ctx.fill();

        }

      });

    }

    function drawMiniMap(){

      miniCtx.clearRect(0,0,220,180);

      miniCtx.fillStyle =
      "#0f172a";

      miniCtx.fillRect(
        0,0,220,180
      );

      miniCtx.fillStyle =
      "#22c55e";

      enemies.forEach(enemy=>{

        if(enemy.alive){

          miniCtx.fillRect(
            enemy.x/mapWidth*220,
            enemy.y/mapHeight*180,
            4,
            4
          );

        }

      });

      miniCtx.fillStyle =
      "#f97316";

      miniCtx.fillRect(
        player.x/mapWidth*220,
        player.y/mapHeight*180,
        6,
        6
      );

    }

    function gameLoop(){

      ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
      );

      drawMap();

      drawCoins();

      drawEnemies();

      drawNPCs();

      drawPlayer();

      drawMiniMap();

      update();

      requestAnimationFrame(
      gameLoop
      );

    }

    gameLoop();

    /* KEYS */

    window.addEventListener(
    "keydown",
    e=>{

      keys[e.key.toLowerCase()] = true;

      /* TAB */

      if(e.key === "Tab"){

        e.preventDefault();

        document.getElementById(
        "tabMenu"
        ).style.display = "flex";

      }

      /* TALK */

      if(e.key.toLowerCase() === "e"){

        npcs.forEach(npc=>{

          const dx =
          npc.x-player.x;

          const dy =
          npc.y-player.y;

          const dist =
          Math.sqrt(dx*dx+dy*dy);

          if(dist < 100){

            document.getElementById(
            "dialogueBox"
            ).style.display =
            "block";

            document.getElementById(
            "dialogueName"
            ).innerText =
            npc.name;

            document.getElementById(
            "dialogueText"
            ).innerText =
            npc.dialogue;

          }

        });

      }

      /* BLACKSMITH */

      if(e.key.toLowerCase() === "f"){

        const blacksmith =
        npcs[1];

        const dx =
        blacksmith.x-player.x;

        const dy =
        blacksmith.y-player.y;

        const dist =
        Math.sqrt(dx*dx+dy*dy);

        if(dist < 120){

          if(player.coins >= 50){

            player.coins -= 50;

            player.weapon++;

          }

        }

      }

      /* CLOSE DIALOG */

      if(e.key === "Escape"){

        document.getElementById(
        "dialogueBox"
        ).style.display =
        "none";

      }

    });

    window.addEventListener(
    "keyup",
    e=>{

      keys[e.key.toLowerCase()] =
      false;

      if(e.key === "Tab"){

        document.getElementById(
        "tabMenu"
        ).style.display = "none";

      }

    });

    /* ADS */

    (adsbygoogle =
    window.adsbygoogle || []).push({});

    (adsbygoogle =
    window.adsbygoogle || []).push({});

  </script>

</body>
</html>
